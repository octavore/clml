project_name = "clml"

[packages]
rust = "stable"

[tasks]
# Format with nightly rustfmt (rustfmt.toml uses nightly-only options)
fmt = "cargo +nightly fmt --all"
lint = "cargo clippy --workspace --all-features --all-targets"
build = "cargo build --workspace"
check = "cargo check --workspace --all-features"
doc = "cargo doc --workspace --no-deps"
# Check the crates package cleanly for publishing
package = "cargo package -p clml -p clml-proc-macro --no-verify --allow-dirty"
test = [
  "cargo test --workspace",
  "cargo test --workspace --all-features",
]
ci = [":fmt", ":lint", ":check", ":test"]

[tasks.demo]
command = [
  "cargo run -q -p clml --example stream | cat -v",
  "cargo run -q -p clml --example stream --features anstream | cat -v",
]
description = "Show the anstream feature stripping codes when stdout is not a tty"

[global_packages]
"rvben/rumdl" = "^0.2.52"
