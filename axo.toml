project_name = "clml"

[packages]
rust = "stable"

[tasks]
# Format with nightly rustfmt (rustfmt.toml uses nightly-only options)
"fmt:rust" = ["cargo clippy", "cargo +nightly fmt --all"]
"fmt:md" = "rumdl fmt ."
fmt = [":fmt:rust", ":fmt:md"]
"lint:rust" = "cargo clippy --workspace --all-features --all-targets"
"lint:md" = "rumdl check ."
lint = [":lint:rust", ":lint:md"]
build = "cargo build --workspace"
check = "cargo check --workspace --all-features"
doc = "cargo doc --workspace --no-deps"
# Check the crates package cleanly for publishing
package = "cargo package -p clml -p clml-proc-macro --no-verify --allow-dirty"
test = [
  "cargo test --workspace",
  "cargo test --workspace --all-features",
]
ci = [
  ":lint",
  ":check",
  ":test",
]

[tasks.demo]
command = [
  "cargo run -q -p clml --example stream | cat -v",
  "cargo run -q -p clml --example stream --no-default-features | cat -v",
]
description = "Show the anstream feature stripping codes when stdout is not a tty"

[tasks."crates:publish"]
command = [
  "cargo publish -p clml-proc-macro",
  "cargo publish -p clml",
]
env = {
  "CARGO_REGISTRY_TOKEN" = "axo://projects/crates-io/api-token",
}

[global_packages]
"rvben/rumdl" = "^0.2.52"
