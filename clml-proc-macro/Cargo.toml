[package]
name = "clml-proc-macro"
description = "Implementation for the package clml"
categories = ["development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
nom = "8.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
unindent = { version = "0.2.4", optional = true }

[features]
doc = ["dep:unindent"]
