[package]
name = "clml"
description = "Colorize and stylize strings for the terminal at compile-time, using an HTML-like syntax"
keywords = ["color", "terminal", "ansi", "anstream"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
# Route the printing macros through `anstream`, which adapts ANSI escape codes to the terminal
# (stripping them when not a tty, honouring NO_COLOR, translating for legacy Windows consoles).
anstream = ["dep:anstream"]

[dependencies]
anstream = { version = "1.0", optional = true }
clml-proc-macro.workspace = true
