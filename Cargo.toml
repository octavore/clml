[workspace]
resolver = "3"
members = ["clml-proc-macro", "tests/renamed-dep"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/octavore/clml"

[workspace.dependencies]
clml-proc-macro = { version = "0.2.0", path = "clml-proc-macro" }

[package]
name = "clml"
description = "Colorize and stylize strings for the terminal at compile-time, using an HTML-like syntax"
keywords = ["color", "terminal", "ansi", "anstream"]
categories = ["command-line-interface"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
exclude = ["axo.toml", "axo.lock", ".rumdl.toml", "rustfmt.toml", ".gitignore"]

[features]
default = ["anstream", "doc"]
# Route the printing macros through `anstream`, which adapts ANSI escape codes to the terminal
# (stripping them when not a tty, honouring NO_COLOR, translating for legacy Windows consoles).
anstream = ["dep:anstream"]
# Adds the `...doc!` macros, which dedent multiline format strings the same way `indoc::indoc!()`
# does.
doc = ["clml-proc-macro/doc"]

[dependencies]
anstream = { version = "1.0", optional = true }
clml-proc-macro.workspace = true
